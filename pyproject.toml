[project]
name = "pulldockerimage"
description = "pull docker image and send to stdout"
readme = "readme.md"
version = "0.0.1.0"
license = "BSD-2-Clause"
authors = [
    {name = "cielavenir", email = "cielartisan@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Homepage = "https://github.com/cielavenir/pulldockerimage"

[project.scripts]
# pulldockerimage = "pulldockerimage:main"

[tool.setuptools]
py-modules = ["pulldockerimage"]
zip-safe = false
platforms = ["any"]
